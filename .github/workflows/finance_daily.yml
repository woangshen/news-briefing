name: 每日财经干货on:  schedule:    - cron: '20 22 * * *'→ Runs at 22:20  workflow_dispatch:    inputs:      reason:        description: '触发原因'        required: false        default: '手动测试'permissions:  contents: readjobs:  finance-daily:    runs-on: ubuntu-latest    steps:      - name: 检出代码        uses: actions/checkout@v4      - name: 设置 Python        uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: 安装依赖        run: |          python -m pip install --upgrade pip          pip install -r requirements.txt          pip install edge-tts      - name: 运行财经干货生成        env:          SMTP_USER: ${{ secrets.SMTP_USER }}
