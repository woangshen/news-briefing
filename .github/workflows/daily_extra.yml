name: 每日增值任务
on:
  push:
    branches: [main]
  schedule:
    - cron: '50 22 * * *'
    - cron: '0 23 * * *'
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '30 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER: ${{ secrets.RECEIVER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python daily_extra.py
