name: 每日图书推荐
on:
  push:
    branches: [main]
  schedule:
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests edge-tts
      - name: Run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER: ${{ secrets.RECEIVER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python books_daily.py
