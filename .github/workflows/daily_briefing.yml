name: 每日资讯简报

on:
  schedule:
    # 每天早上 6:40 UTC+8 = 前一晚 22:40 UTC
    - cron: '40 22 * * *'
    # 每天晚上 19:00 UTC+8 = 当天 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: '运行轮次 (morning/evening)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

jobs:
  news-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 判断运行轮次
        id: period
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.period }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            if [ "$HOUR" = "22" ] && [ "$MINUTE" = "40" ]; then
              echo "target=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "11" ] && [ "$MINUTE" = "00" ]; then
              echo "target=evening" >> $GITHUB_OUTPUT
            else
              HOUR_CST=$(date -u +%H | sed 's/^0//')
              HOUR_CST=$((10#$HOUR_CST + 8))
              if [ $HOUR_CST -ge 6 ] && [ $HOUR_CST -lt 12 ]; then
                echo "target=morning" >> $GITHUB_OUTPUT
              else
                echo "target=evening" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: 运行新闻简报
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: |
          python news_briefing.py ${{ steps.period.outputs.target }}
          echo "推送完成"

      - name: 运行失败通知
        if: failure()
        run: |
          echo "简报任务失败，请检查 GitHub Secrets 或脚本错误"
