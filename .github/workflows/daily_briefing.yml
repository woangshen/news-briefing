name: 每日资讯简报
on:
  push:
    branches: [main]
  schedule:
    - cron: '40 22 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install requests edge-tts feedparser beautifulsoup4 lxml
      - name: 运行
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER: ${{ secrets.RECEIVER }}
        run: python daily_briefing.py
