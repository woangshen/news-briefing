name: 每日资讯简报on:  schedule:    - cron: '40 22 * * *'→ Runs at 22:40    - cron: '0 11 * * *'→ Runs at 11:00  workflow_dispatch:permissions:  contents: readjobs:  news-briefing:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: Install deps        run: |          python -m pip install --upgrade pip          pip install -r requirements.txt          pip install edge-tts      - name: Run        env:          SMTP_USER: ${{ secrets.SMTP_USER }}          SMTP_PASS: ${{ secrets.SMTP_PASS }}          RECEIVER: ${{ secrets.RECEIVER }}        run: python news_briefing.py
